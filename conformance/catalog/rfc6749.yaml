document: RFC6749
title: The OAuth 2.0 Authorization Framework
source: ../specs/rfc6749.txt
requirements:
  - id: RFC6749-1.6-01
    section: "1.6"
    keyword: MAY
    text: Implementations MAY also support additional transport-layer security mechanisms that meet their security requirements.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-05
  - id: RFC6749-2-01
    section: "2"
    keyword: SHALL
    text: 'When registering a client, the client developer SHALL: specify the client type as described in Section 2.1, provide its client redirection URIs as described in Section 3.1.2, and include any other information required by the authorization server (e.g., application name, website, description, logo image, the acceptance of legal terms).'
    status: superseded
    superseded_by:
      - OAUTH21D16-2-01
  - id: RFC6749-2.1-01
    section: "2.1"
    keyword: SHOULD NOT
    text: The authorization server SHOULD NOT make assumptions about the client type.
    status: applicable
  - id: RFC6749-2.1-02
    section: "2.1"
    keyword: SHOULD
    text: If the authorization server does not provide support for such clients or does not provide guidance with regard to their registration, the client SHOULD register each component as a separate client.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.1-03
  - id: RFC6749-2.2-01
    section: "2.2"
    keyword: MUST NOT
    text: The client identifier is not a secret; it is exposed to the resource owner and MUST NOT be used alone for client authentication.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.2-01
  - id: RFC6749-2.2-02
    section: "2.2"
    keyword: SHOULD
    text: The authorization server SHOULD document the size of any identifier it issues.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.7.1-02
  - id: RFC6749-2.3-01
    section: "2.3"
    keyword: MAY
    text: The authorization server MAY accept any form of client authentication meeting its security requirements.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4-02
  - id: RFC6749-2.3-02
    section: "2.3"
    keyword: MAY
    text: The authorization server MAY establish a client authentication method with public clients.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4-01
  - id: RFC6749-2.3-03
    section: "2.3"
    keyword: MUST NOT
    text: However, the authorization server MUST NOT rely on public client authentication for the purpose of identifying the client.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4-01
  - id: RFC6749-2.3-04
    section: "2.3"
    keyword: MUST NOT
    text: The client MUST NOT use more than one authentication method in each request.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4-06
  - id: RFC6749-2.3.1-01
    section: 2.3.1
    keyword: MAY
    text: Clients in possession of a client password MAY use the HTTP Basic authentication scheme as defined in [RFC2617] to authenticate with the authorization server.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.1-05
  - id: RFC6749-2.3.1-02
    section: 2.3.1
    keyword: MUST
    text: The authorization server MUST support the HTTP Basic authentication scheme for authenticating clients that were issued a client password.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.1-05
      - OAUTH21D16-2.4.1-01
    note: OAuth 2.1 makes HTTP Basic optional and client credentials in the request body mandatory.
  - id: RFC6749-2.3.1-03
    section: 2.3.1
    keyword: MAY
    text: 'Alternatively, the authorization server MAY support including the client credentials in the request-body using the following parameters:'
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.1-01
  - id: RFC6749-2.3.1-04
    section: 2.3.1
    keyword: REQUIRED
    text: client_id REQUIRED.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.1-02
  - id: RFC6749-2.3.1-05
    section: 2.3.1
    keyword: REQUIRED
    text: client_secret REQUIRED.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.1-03
  - id: RFC6749-2.3.1-06
    section: 2.3.1
    keyword: MAY
    text: The client MAY omit the parameter if the client secret is an empty string.
    status: out-of-scope
    reason: client-requirement
  - id: RFC6749-2.3.1-07
    section: 2.3.1
    keyword: NOT RECOMMENDED
    text: Including the client credentials in the request-body using the two parameters is NOT RECOMMENDED and SHOULD be limited to clients unable to directly utilize the HTTP Basic authentication scheme (or other password-based HTTP authentication schemes).
    statement: Including the client credentials in the request-body using the two parameters is NOT RECOMMENDED.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.1-01
  - id: RFC6749-2.3.1-08
    section: 2.3.1
    keyword: SHOULD
    text: Including the client credentials in the request-body using the two parameters is NOT RECOMMENDED and SHOULD be limited to clients unable to directly utilize the HTTP Basic authentication scheme (or other password-based HTTP authentication schemes).
    statement: Including the client credentials in the request-body SHOULD be limited to clients unable to directly utilize the HTTP Basic authentication scheme.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.1-01
  - id: RFC6749-2.3.1-09
    section: 2.3.1
    keyword: MUST NOT
    text: The parameters can only be transmitted in the request-body and MUST NOT be included in the request URI.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.1-04
  - id: RFC6749-2.3.1-10
    section: 2.3.1
    keyword: MUST
    text: The authorization server MUST require the use of TLS as described in Section 1.6 when sending requests using password authentication.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-01
  - id: RFC6749-2.3.1-11
    section: 2.3.1
    keyword: MUST
    text: Since this client authentication method involves a password, the authorization server MUST protect any endpoint utilizing it against brute force attacks.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.1-06
  - id: RFC6749-2.3.2-01
    section: 2.3.2
    keyword: MAY
    text: The authorization server MAY support any suitable HTTP authentication scheme matching its security requirements.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.2-01
  - id: RFC6749-2.3.2-02
    section: 2.3.2
    keyword: MUST
    text: When using other authentication methods, the authorization server MUST define a mapping between the client identifier (registration record) and authentication scheme.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.4.2-02
  - id: RFC6749-3-01
    section: "3"
    keyword: MAY
    text: Extension grant types MAY define additional endpoints as needed.
    status: superseded
    superseded_by:
      - OAUTH21D16-3-01
  - id: RFC6749-3.1-01
    section: "3.1"
    keyword: MUST
    text: The authorization server MUST first verify the identity of the resource owner.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.1-01
  - id: RFC6749-3.1-02
    section: "3.1"
    keyword: MAY
    text: The endpoint URI MAY include an "application/x-www-form-urlencoded" formatted (per Appendix B) query component ([RFC3986] Section 3.4), which MUST be retained when adding additional query parameters.
    statement: The endpoint URI MAY include a query component.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.1-03
  - id: RFC6749-3.1-03
    section: "3.1"
    keyword: MUST
    text: The endpoint URI MAY include an "application/x-www-form-urlencoded" formatted (per Appendix B) query component ([RFC3986] Section 3.4), which MUST be retained when adding additional query parameters.
    statement: A query component of the endpoint URI MUST be retained when adding additional query parameters.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.1-04
  - id: RFC6749-3.1-04
    section: "3.1"
    keyword: MUST NOT
    text: The endpoint URI MUST NOT include a fragment component.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.1-02
  - id: RFC6749-3.1-05
    section: "3.1"
    keyword: MUST
    text: Since requests to the authorization endpoint result in user authentication and the transmission of clear-text credentials (in the HTTP response), the authorization server MUST require the use of TLS as described in Section 1.6 when sending requests to the authorization endpoint.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-01
      - OAUTH21D16-1.5-02
  - id: RFC6749-3.1-06
    section: "3.1"
    keyword: MUST
    text: The authorization server MUST support the use of the HTTP "GET" method [RFC2616] for the authorization endpoint and MAY support the use of the "POST" method as well.
    statement: The authorization server MUST support the use of the HTTP GET method for the authorization endpoint.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.1-05
  - id: RFC6749-3.1-07
    section: "3.1"
    keyword: MAY
    text: The authorization server MUST support the use of the HTTP "GET" method [RFC2616] for the authorization endpoint and MAY support the use of the "POST" method as well.
    statement: The authorization server MAY support the use of the POST method for the authorization endpoint.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.1-06
  - id: RFC6749-3.1-08
    section: "3.1"
    keyword: MUST
    text: Parameters sent without a value MUST be treated as if they were omitted from the request.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.1-09
  - id: RFC6749-3.1-09
    section: "3.1"
    keyword: MUST
    text: The authorization server MUST ignore unrecognized request parameters.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.1-07
  - id: RFC6749-3.1-10
    section: "3.1"
    keyword: MUST NOT
    text: Request and response parameters MUST NOT be included more than once.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.1-08
      - OAUTH21D16-3.1-12
  - id: RFC6749-3.1.1-01
    section: 3.1.1
    keyword: REQUIRED
    text: response_type REQUIRED.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-01
  - id: RFC6749-3.1.1-02
    section: 3.1.1
    keyword: MUST
    text: The value MUST be one of "code" for requesting an authorization code as described by Section 4.1.1, "token" for requesting an access token (implicit grant) as described by Section 4.2.1, or a registered extension value as described by Section 8.4.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-03
    note: OAuth 2.1 removes the implicit grant.
  - id: RFC6749-3.1.1-03
    section: 3.1.1
    keyword: MAY
    text: Extension response types MAY contain a space-delimited (%x20) list of values, where the order of values does not matter (e.g., response type "a b" is the same as "b a").
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-02
  - id: RFC6749-3.1.1-04
    section: 3.1.1
    keyword: MUST
    text: If an authorization request is missing the "response_type" parameter, or if the response type is not understood, the authorization server MUST return an error response as described in Section 4.1.2.1.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-03
  - id: RFC6749-3.1.2-01
    section: 3.1.2
    keyword: MUST
    text: The redirection endpoint URI MUST be an absolute URI as defined by [RFC3986] Section 4.3.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3-01
  - id: RFC6749-3.1.2-02
    section: 3.1.2
    keyword: MAY
    text: The endpoint URI MAY include an "application/x-www-form-urlencoded" formatted (per Appendix B) query component ([RFC3986] Section 3.4), which MUST be retained when adding additional query parameters.
    statement: The endpoint URI MAY include a query component.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3-02
  - id: RFC6749-3.1.2-03
    section: 3.1.2
    keyword: MUST
    text: The endpoint URI MAY include an "application/x-www-form-urlencoded" formatted (per Appendix B) query component ([RFC3986] Section 3.4), which MUST be retained when adding additional query parameters.
    statement: A query component of the endpoint URI MUST be retained when adding additional query parameters.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3-03
  - id: RFC6749-3.1.2-04
    section: 3.1.2
    keyword: MUST NOT
    text: The endpoint URI MUST NOT include a fragment component.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3-04
  - id: RFC6749-3.1.2.1-01
    section: 3.1.2.1
    keyword: SHOULD
    text: The redirection endpoint SHOULD require the use of TLS as described in Section 1.6 when the requested response type is "code" or "token", or when the redirection request will result in the transmission of sensitive credentials over an open network.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-07
  - id: RFC6749-3.1.2.1-02
    section: 3.1.2.1
    keyword: SHOULD
    text: If TLS is not available, the authorization server SHOULD warn the resource owner about the insecure endpoint prior to redirection (e.g., display a message during the authorization request).
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-07
    note: OAuth 2.1 requires https for redirect URIs other than loopback ones.
  - id: RFC6749-3.1.2.2-01
    section: 3.1.2.2
    keyword: MUST
    text: 'The authorization server MUST require the following clients to register their redirection endpoint: Public clients. Confidential clients utilizing the implicit grant type.'
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.1-01
  - id: RFC6749-3.1.2.2-02
    section: 3.1.2.2
    keyword: SHOULD
    text: The authorization server SHOULD require all clients to register their redirection endpoint prior to utilizing the authorization endpoint.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.1-01
  - id: RFC6749-3.1.2.2-03
    section: 3.1.2.2
    keyword: SHOULD
    text: The authorization server SHOULD require the client to provide the complete redirection URI (the client MAY use the "state" request parameter to achieve per-request customization).
    statement: The authorization server SHOULD require the client to provide the complete redirection URI.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.1-01
  - id: RFC6749-3.1.2.2-04
    section: 3.1.2.2
    keyword: MAY
    text: The authorization server SHOULD require the client to provide the complete redirection URI (the client MAY use the "state" request parameter to achieve per-request customization).
    statement: The client MAY use the state request parameter to achieve per-request customization.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.1-07
  - id: RFC6749-3.1.2.2-05
    section: 3.1.2.2
    keyword: SHOULD
    text: If requiring the registration of the complete redirection URI is not possible, the authorization server SHOULD require the registration of the URI scheme, authority, and path (allowing the client to dynamically vary only the query component of the redirection URI when requesting authorization).
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.1-01
      - OAUTH21D16-2.3.1-02
    note: OAuth 2.1 requires the complete redirect URI and exact matching.
  - id: RFC6749-3.1.2.2-06
    section: 3.1.2.2
    keyword: MAY
    text: The authorization server MAY allow the client to register multiple redirection endpoints.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.1-03
  - id: RFC6749-3.1.2.3-01
    section: 3.1.2.3
    keyword: MUST
    text: If multiple redirection URIs have been registered, if only part of the redirection URI has been registered, or if no redirection URI has been registered, the client MUST include a redirection URI with the authorization request using the "redirect_uri" request parameter.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.2-01
  - id: RFC6749-3.1.2.3-02
    section: 3.1.2.3
    keyword: MUST
    text: When a redirection URI is included in an authorization request, the authorization server MUST compare and match the value received against at least one of the registered redirection URIs (or URI components) as defined in [RFC3986] Section 6, if any redirection URIs were registered.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.1-02
      - OAUTH21D16-4.1.1-19
    note: OAuth 2.1 requires exact matching against a complete registered redirect URI.
  - id: RFC6749-3.1.2.3-03
    section: 3.1.2.3
    keyword: MUST
    text: If the client registration included the full redirection URI, the authorization server MUST compare the two URIs using simple string comparison as defined in [RFC3986] Section 6.2.1.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-20
  - id: RFC6749-3.1.2.4-01
    section: 3.1.2.4
    keyword: SHOULD
    text: If an authorization request fails validation due to a missing, invalid, or mismatching redirection URI, the authorization server SHOULD inform the resource owner of the error and MUST NOT automatically redirect the user-agent to the invalid redirection URI.
    statement: If an authorization request fails validation due to a missing, invalid, or mismatching redirection URI, the authorization server SHOULD inform the resource owner of the error.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.5-01
  - id: RFC6749-3.1.2.4-02
    section: 3.1.2.4
    keyword: MUST NOT
    text: If an authorization request fails validation due to a missing, invalid, or mismatching redirection URI, the authorization server SHOULD inform the resource owner of the error and MUST NOT automatically redirect the user-agent to the invalid redirection URI.
    statement: If an authorization request fails validation due to a missing, invalid, or mismatching redirection URI, the authorization server MUST NOT automatically redirect the user-agent to the invalid redirection URI.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.5-02
  - id: RFC6749-3.1.2.5-01
    section: 3.1.2.5
    keyword: SHOULD NOT
    text: The client SHOULD NOT include any third-party scripts (e.g., third-party analytics, social plug-ins, ad networks) in the redirection endpoint response.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.6-01
  - id: RFC6749-3.1.2.5-02
    section: 3.1.2.5
    keyword: SHOULD
    text: Instead, it SHOULD extract the credentials from the URI and redirect the user-agent again to another endpoint without exposing the credentials (in the URI or elsewhere).
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.6-02
  - id: RFC6749-3.1.2.5-03
    section: 3.1.2.5
    keyword: MUST
    text: If third-party scripts are included, the client MUST ensure that its own scripts (used to extract and remove the credentials from the URI) will execute first.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.6-03
  - id: RFC6749-3.2-01
    section: "3.2"
    keyword: MAY
    text: The endpoint URI MAY include an "application/x-www-form-urlencoded" formatted (per Appendix B) query component ([RFC3986] Section 3.4), which MUST be retained when adding additional query parameters.
    statement: The endpoint URI MAY include a query component.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2-02
  - id: RFC6749-3.2-02
    section: "3.2"
    keyword: MUST
    text: The endpoint URI MAY include an "application/x-www-form-urlencoded" formatted (per Appendix B) query component ([RFC3986] Section 3.4), which MUST be retained when adding additional query parameters.
    statement: A query component of the endpoint URI MUST be retained when adding additional query parameters.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2-02
    note: OAuth 2.1 keeps only the query component's MAY for the token endpoint URL.
  - id: RFC6749-3.2-03
    section: "3.2"
    keyword: MUST NOT
    text: The endpoint URI MUST NOT include a fragment component.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2-01
  - id: RFC6749-3.2-04
    section: "3.2"
    keyword: MUST
    text: Since requests to the token endpoint result in the transmission of clear-text credentials (in the HTTP request and response), the authorization server MUST require the use of TLS as described in Section 1.6 when sending requests to the token endpoint.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-01
  - id: RFC6749-3.2-05
    section: "3.2"
    keyword: MUST
    text: The client MUST use the HTTP "POST" method when making access token requests.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2-03
  - id: RFC6749-3.2-06
    section: "3.2"
    keyword: MUST
    text: Parameters sent without a value MUST be treated as if they were omitted from the request.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2-05
  - id: RFC6749-3.2-07
    section: "3.2"
    keyword: MUST
    text: The authorization server MUST ignore unrecognized request parameters.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2-04
  - id: RFC6749-3.2-08
    section: "3.2"
    keyword: MUST NOT
    text: Request and response parameters MUST NOT be included more than once.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2-06
      - OAUTH21D16-3.2-07
  - id: RFC6749-3.2.1-01
    section: 3.2.1
    keyword: MUST
    text: Confidential clients or other clients issued client credentials MUST authenticate with the authorization server as described in Section 2.3 when making requests to the token endpoint.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2.1-01
  - id: RFC6749-3.2.1-02
    section: 3.2.1
    keyword: MAY
    text: A client MAY use the "client_id" request parameter to identify itself when sending requests to the token endpoint.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2.2-02
  - id: RFC6749-3.2.1-03
    section: 3.2.1
    keyword: MUST
    text: In the "authorization_code" "grant_type" request to the token endpoint, an unauthenticated client MUST send its "client_id" to prevent itself from inadvertently accepting a code intended for a client with a different "client_id".
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.3-04
  - id: RFC6749-3.3-01
    section: "3.3"
    keyword: MAY
    text: The authorization server MAY fully or partially ignore the scope requested by the client, based on the authorization server policy or the resource owner's instructions.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.4.1-01
  - id: RFC6749-3.3-02
    section: "3.3"
    keyword: MUST
    text: If the issued access token scope is different from the one requested by the client, the authorization server MUST include the "scope" response parameter to inform the client of the actual scope granted.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.4.1-02
  - id: RFC6749-3.3-03
    section: "3.3"
    keyword: MUST
    text: If the client omits the scope parameter when requesting authorization, the authorization server MUST either process the request using a pre-defined default value or fail the request indicating an invalid scope.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.4.1-03
  - id: RFC6749-3.3-04
    section: "3.3"
    keyword: SHOULD
    text: The authorization server SHOULD document its scope requirements and default value (if defined).
    status: superseded
    superseded_by:
      - OAUTH21D16-1.4.1-04
  - id: RFC6749-4.1.1-01
    section: 4.1.1
    keyword: REQUIRED
    text: response_type REQUIRED.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-01
      - OAUTH21D16-4.1.1-05
    note: OAuth 2.1 makes PKCE mandatory and adds code_challenge to the authorization request.
  - id: RFC6749-4.1.1-02
    section: 4.1.1
    keyword: MUST
    text: Value MUST be set to "code".
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-01
  - id: RFC6749-4.1.1-03
    section: 4.1.1
    keyword: REQUIRED
    text: client_id REQUIRED.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-04
  - id: RFC6749-4.1.1-04
    section: 4.1.1
    keyword: OPTIONAL
    text: redirect_uri OPTIONAL.
