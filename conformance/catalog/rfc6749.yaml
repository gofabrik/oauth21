    section: "10.5"
    keyword: SHOULD
    text: The transmission of authorization codes SHOULD be made over a secure channel, and the client SHOULD require the use of TLS with its redirection URI if the URI identifies a network resource.
    statement: The transmission of authorization codes SHOULD be made over a secure channel.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-01
  - id: RFC6749-10.5-02
    section: "10.5"
    keyword: SHOULD
    text: The transmission of authorization codes SHOULD be made over a secure channel, and the client SHOULD require the use of TLS with its redirection URI if the URI identifies a network resource.
    statement: The client SHOULD require the use of TLS with its redirection URI if the URI identifies a network resource.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-07
  - id: RFC6749-10.5-03
    section: "10.5"
    keyword: MUST
    text: Therefore, if the client relies on the authorization code for its own resource owner authentication, the client redirection endpoint MUST require the use of TLS.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-07
  - id: RFC6749-10.5-04
    section: "10.5"
    keyword: MUST
    text: Authorization codes MUST be short lived and single-use.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.2-02
      - OAUTH21D16-4.1.3-05
  - id: RFC6749-10.5-05
    section: "10.5"
    keyword: SHOULD
    text: If the authorization server observes multiple attempts to exchange an authorization code for an access token, the authorization server SHOULD attempt to revoke all access tokens already granted based on the compromised authorization code.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.3-07
  - id: RFC6749-10.5-06
    section: "10.5"
    keyword: MUST
    text: If the client can be authenticated, the authorization servers MUST authenticate the client and ensure that the authorization code was issued to the same client.
    status: superseded
    superseded_by:
      - OAUTH21D16-3.2.2-05
      - OAUTH21D16-4.1.3-08
  - id: RFC6749-10.6-01
    section: "10.6"
    keyword: MUST
    text: In order to prevent such an attack, the authorization server MUST ensure that the redirection URI used to obtain the authorization code is identical to the redirection URI provided when exchanging the authorization code for an access token.
    status: superseded
    superseded_by:
      - OAUTH21D16-10.2-02
    note: OAuth 2.1 removes redirect_uri from the token request and keeps it only for OAuth 2.0 Clients.
  - id: RFC6749-10.6-02
    section: "10.6"
    keyword: MUST
    text: The authorization server MUST require public clients and SHOULD require confidential clients to register their redirection URIs.
    statement: The authorization server MUST require public clients to register their redirection URIs.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.1-01
  - id: RFC6749-10.6-03
    section: "10.6"
    keyword: SHOULD
    text: The authorization server MUST require public clients and SHOULD require confidential clients to register their redirection URIs.
    statement: The authorization server SHOULD require confidential clients to register their redirection URIs.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.1-01
  - id: RFC6749-10.6-04
    section: "10.6"
    keyword: MUST
    text: If a redirection URI is provided in the request, the authorization server MUST validate it against the registered value.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-19
  - id: RFC6749-10.7-01
    section: "10.7"
    keyword: SHOULD
    text: The authorization server and client SHOULD minimize use of this grant type and utilize other grant types whenever possible.
    status: superseded
    superseded_by:
      - RFC9700-2.4-01
    note: RFC 9700 forbids the resource owner password credentials grant.
  - id: RFC6749-10.8-01
    section: "10.8"
    keyword: MUST NOT
    text: Access tokens, refresh tokens, resource owner passwords, and client credentials MUST NOT be transmitted in the clear.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-01
  - id: RFC6749-10.8-02
    section: "10.8"
    keyword: SHOULD NOT
    text: Authorization codes SHOULD NOT be transmitted in the clear.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-01
  - id: RFC6749-10.8-03
    section: "10.8"
    keyword: SHOULD NOT
    text: The "state" and "scope" parameters SHOULD NOT include sensitive client or resource owner information in plain text, as they can be transmitted over insecure channels or stored insecurely.
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-18
  - id: RFC6749-10.9-01
    section: "10.9"
    keyword: MUST
    text: In order to prevent man-in-the-middle attacks, the authorization server MUST require the use of TLS with server authentication as defined by [RFC2818] for any request sent to the authorization and token endpoints.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-01
      - OAUTH21D16-1.5-02
  - id: RFC6749-10.9-02
    section: "10.9"
    keyword: MUST
    text: The client MUST validate the authorization server's TLS certificate as defined by [RFC6125] and in accordance with its requirements for server identity authentication.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-04
  - id: RFC6749-10.10-01
    section: "10.10"
    keyword: MUST
    text: The authorization server MUST prevent attackers from guessing access tokens, authorization codes, refresh tokens, resource owner passwords, and client credentials.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.7-01
      - OAUTH21D16-7.7-05
      - OAUTH21D16-7.7-06
      - OAUTH21D16-7.7-07
      - OAUTH21D16-7.7-08
  - id: RFC6749-10.10-02
    section: "10.10"
    keyword: MUST
    text: The probability of an attacker guessing generated tokens (and other credentials not intended for handling by end-users) MUST be less than or equal to 2^(-128) and SHOULD be less than or equal to 2^(-160).
    statement: The probability of an attacker guessing generated tokens (and other credentials not intended for handling by end-users) MUST be less than or equal to 2^(-128).
    status: superseded
    superseded_by:
      - OAUTH21D16-7.7-02
  - id: RFC6749-10.10-03
    section: "10.10"
    keyword: SHOULD
    text: The probability of an attacker guessing generated tokens (and other credentials not intended for handling by end-users) MUST be less than or equal to 2^(-128) and SHOULD be less than or equal to 2^(-160).
    statement: The probability of an attacker guessing generated tokens (and other credentials not intended for handling by end-users) SHOULD be less than or equal to 2^(-160).
    status: superseded
    superseded_by:
      - OAUTH21D16-7.7-03
  - id: RFC6749-10.10-04
    section: "10.10"
    keyword: MUST
    text: The authorization server MUST utilize other means to protect credentials intended for end-user usage.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.7-04
  - id: RFC6749-10.11-01
    section: "10.11"
    keyword: MUST
    text: To reduce the risk of phishing attacks, the authorization servers MUST require the use of TLS on every endpoint used for end-user interaction.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-02
  - id: RFC6749-10.12-01
    section: "10.12"
    keyword: MUST
    text: The client MUST implement CSRF protection for its redirection URI.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.3-01
  - id: RFC6749-10.12-02
    section: "10.12"
    keyword: SHOULD
    text: The client SHOULD utilize the "state" request parameter to deliver this value to the authorization server when making an authorization request.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.3-03
  - id: RFC6749-10.12-03
    section: "10.12"
    keyword: MUST
    text: The binding value used for CSRF protection MUST contain a non-guessable value (as described in Section 10.10), and the user-agent's authenticated state (e.g., session cookie, HTML5 local storage) MUST be kept in a location accessible only to the client and the user-agent (i.e., protected by same-origin policy).
    statement: The binding value used for CSRF protection MUST contain a non-guessable value.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.3-03
  - id: RFC6749-10.12-04
    section: "10.12"
    keyword: MUST
    text: The binding value used for CSRF protection MUST contain a non-guessable value (as described in Section 10.10), and the user-agent's authenticated state (e.g., session cookie, HTML5 local storage) MUST be kept in a location accessible only to the client and the user-agent (i.e., protected by same-origin policy).
    statement: The user-agent's authenticated state MUST be kept in a location accessible only to the client and the user-agent.
    status: superseded
    superseded_by:
      - OAUTH21D16-2.3.3-03
  - id: RFC6749-10.12-05
    section: "10.12"
    keyword: MUST
    text: The authorization server MUST implement CSRF protection for its authorization endpoint and ensure that a malicious client cannot obtain authorization without the awareness and explicit consent of the resource owner.
    statement: The authorization server MUST implement CSRF protection for its authorization endpoint.
    status: applicable
  - id: RFC6749-10.12-06
    section: "10.12"
    keyword: MUST
    text: The authorization server MUST implement CSRF protection for its authorization endpoint and ensure that a malicious client cannot obtain authorization without the awareness and explicit consent of the resource owner.
    statement: The authorization server MUST ensure that a malicious client cannot obtain authorization without the awareness and explicit consent of the resource owner.
    status: applicable
  - id: RFC6749-10.13-01
    section: "10.13"
    keyword: SHOULD
    text: To prevent this form of attack, native applications SHOULD use external browsers instead of embedding browsers within the application when requesting end-user authorization.
    status: superseded
    superseded_by:
      - OAUTH21D16-8.2-01
  - id: RFC6749-10.14-01
    section: "10.14"
    keyword: MUST
    text: The authorization server and client MUST sanitize (and validate when possible) any value received -- in particular, the value of the "state" and "redirect_uri" parameters.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.12-01
      - OAUTH21D16-7.12-02
  - id: RFC6749-10.16-01
    section: "10.16"
    keyword: MUST NOT
    text: Any specification that uses the authorization process as a form of delegated end-user authentication to the client (e.g., third-party sign-in service) MUST NOT use the implicit flow without additional security mechanisms that would enable the client to determine if the access token was issued for its use (e.g., audience-restricting the access token).
    status: superseded
    superseded_by:
      - OAUTH21D16-4.1.1-03
    note: OAuth 2.1 removes the implicit grant.
  - id: RFC6749-11.1.1-01
    section: 11.1.1
    keyword: MUST
    text: New parameters MUST be separately registered in the OAuth Parameters registry as described by Section 11.2.
    status: informative
  - id: RFC6749-11.4.1-01
    section: 11.4.1
    keyword: MUST NOT
    text: Values for the error name MUST NOT include characters outside the set %x20-21 / %x23-5B / %x5D-7E.
    status: informative
    note: A rule for names registered in the OAuth Extensions Error registry, not for the server.
  - id: RFC6749-B-01
    section: B
    keyword: MUST
    text: To address this shortcoming when generating payloads using this media type, names and values MUST be encoded using the UTF-8 character encoding scheme [RFC3629] first; the resulting octet sequence then needs to be further encoded using the escaping rules defined in [W3C.REC-html401-19991224].
    status: superseded
    superseded_by:
      - OAUTH21D16-B-01
