document: INV
title: Security Invariants
requirements:
  - id: INV-0001
    keyword: MUST
    text: An authorization code issues tokens at most once, also when it is redeemed concurrently.
    status: applicable
  - id: INV-0002
    keyword: MUST
    text: Stores receive authorization codes, access tokens and refresh tokens only as their SHA-256 hashes.
    status: applicable
  - id: INV-0003
    keyword: MUST
    text: A Client obtains only scopes that are supported, allowed for it, requested or default for it, and, for a Grant from a Resource Owner, granted by the Host Application.
    status: applicable
  - id: INV-0004
    keyword: MUST
    text: A refresh token that rotates issues tokens at most once, also when it is used concurrently, and presenting it after its rotation revokes its Grant while any token of the Grant is valid.
    status: applicable
  - id: INV-0005
    keyword: MUST
    text: A token, revocation or introspection request in which a Client uses more than one authentication method is rejected with invalid_request.
    status: applicable
  - id: INV-0006
    keyword: MUST
    text: The token, revocation and introspection endpoints reject requests that do not use POST.
    status: applicable
  - id: INV-0007
    keyword: MUST
    text: The server writes no authorization code, access token, refresh token, Client secret or code verifier to the log or log/slog default loggers.
    status: applicable
  - id: INV-0008
    keyword: MUST
    text: The server compares Client secrets and code verifiers in constant time.
    status: applicable
  - id: INV-0009
    keyword: MUST
    text: An Authorization Request is completed or denied at most once.
    status: applicable
  - id: INV-0010
    keyword: MUST
    text: Of concurrent completions and denials of a pending Authorization Request, exactly one succeeds.
    status: applicable
  - id: INV-0011
    keyword: MUST
    text: An Authorization Request is neither completed nor denied after its lifetime.
    status: applicable
  - id: INV-0012
    keyword: MUST
    text: Revoking a Grant invalidates every access token and refresh token of the Grant.
    status: applicable
  - id: INV-0013
    keyword: MUST
    text: A refresh whose Grant is revoked while it runs leaves no valid access token or refresh token.
    status: applicable
  - id: INV-0014
    keyword: MUST
    text: Every Authorization Request ID, authorization code, access token and refresh token the server issues carries at least 128 bits of randomness.
    status: applicable
  - id: INV-0015
    keyword: MUST
    text: The token endpoint refuses the resource owner password credentials grant with unsupported_grant_type.
    status: applicable
  - id: INV-0016
    keyword: MUST
    text: The endpoints of the Authorization Server and the bearer middleware never take the transport of a request from its forwarded headers.
    status: applicable
