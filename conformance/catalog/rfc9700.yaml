  - id: RFC9700-4.16-02
    section: "4.16"
    keyword: SHOULD
    text: In addition to those, authorization servers SHOULD also use Content Security Policy (CSP) level 2 [W3C.CSP-2] or greater.
    status: applicable
  - id: RFC9700-4.16-03
    section: "4.16"
    keyword: MAY
    text: The client MAY permit being framed by some other origin than the one used in its redirection endpoint.
    status: out-of-scope
    reason: client-requirement
  - id: RFC9700-4.16-04
    section: "4.16"
    keyword: SHOULD
    text: For this reason, authorization servers SHOULD allow administrators to configure allowed origins for particular clients and/or for clients to register these dynamically.
    status: applicable
    note: Registered in store.Client.FrameAncestors; ProtectFraming allows only https origins.
  - id: RFC9700-4.16-05
    section: "4.16"
    keyword: SHOULD
    text: Because some user agents do not support [W3C.CSP-2], this technique SHOULD be combined with others, including those described in [RFC6819], unless such legacy user agents are explicitly unsupported by the authorization server.
    status: applicable
  - id: RFC9700-4.16-06
    section: "4.16"
    keyword: SHOULD
    text: Even in such cases, additional countermeasures SHOULD still be employed.
    status: applicable
  - id: RFC9700-4.17.2-01
    section: 4.17.2
