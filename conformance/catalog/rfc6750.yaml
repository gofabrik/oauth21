document: RFC6750
title: 'The OAuth 2.0 Authorization Framework: Bearer Token Usage'
source: ../specs/rfc6750.txt
requirements:
  - id: RFC6750-2-01
    section: "2"
    keyword: MUST NOT
    text: Clients MUST NOT use more than one method to transmit the token in each request.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1-02
  - id: RFC6750-2.1-01
    section: "2.1"
    keyword: SHOULD
    text: Clients SHOULD make authenticated requests with a bearer token using the "Authorization" request header field with the "Bearer" HTTP authorization scheme.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1.1-01
  - id: RFC6750-2.1-02
    section: "2.1"
    keyword: MUST
    text: Resource servers MUST support this method.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1.1-02
  - id: RFC6750-2.2-01
    section: "2.2"
    keyword: MUST NOT
    text: 'The client MUST NOT use this method unless all of the following conditions are met: The HTTP request entity-header includes the "Content-Type" header field set to "application/x-www-form-urlencoded". The entity-body follows the encoding requirements of the "application/x-www-form-urlencoded" content-type as defined by HTML 4.01 [W3C.REC-html401-19991224]. The HTTP request entity-body is single-part. The content to be encoded in the entity-body MUST consist entirely of ASCII [USASCII] characters. The HTTP request method is one for which the request-body has defined semantics. In particular, this means that the "GET" method MUST NOT be used.'
    statement: The client MUST NOT use the form-encoded body parameter method unless all of the conditions are met.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1.2-01
  - id: RFC6750-2.2-02
    section: "2.2"
    keyword: MUST
    text: 'The client MUST NOT use this method unless all of the following conditions are met: The HTTP request entity-header includes the "Content-Type" header field set to "application/x-www-form-urlencoded". The entity-body follows the encoding requirements of the "application/x-www-form-urlencoded" content-type as defined by HTML 4.01 [W3C.REC-html401-19991224]. The HTTP request entity-body is single-part. The content to be encoded in the entity-body MUST consist entirely of ASCII [USASCII] characters. The HTTP request method is one for which the request-body has defined semantics. In particular, this means that the "GET" method MUST NOT be used.'
    statement: The content to be encoded in the entity-body MUST consist entirely of ASCII characters.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1.2-02
  - id: RFC6750-2.2-03
    section: "2.2"
    keyword: MUST NOT
    text: 'The client MUST NOT use this method unless all of the following conditions are met: The HTTP request entity-header includes the "Content-Type" header field set to "application/x-www-form-urlencoded". The entity-body follows the encoding requirements of the "application/x-www-form-urlencoded" content-type as defined by HTML 4.01 [W3C.REC-html401-19991224]. The HTTP request entity-body is single-part. The content to be encoded in the entity-body MUST consist entirely of ASCII [USASCII] characters. The HTTP request method is one for which the request-body has defined semantics. In particular, this means that the "GET" method MUST NOT be used.'
    statement: The GET method MUST NOT be used with the form-encoded body parameter method.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1.2-03
  - id: RFC6750-2.2-04
    section: "2.2"
    keyword: MAY
    text: The entity-body MAY include other request-specific parameters, in which case the "access_token" parameter MUST be properly separated from the request-specific parameters using "&" character(s) (ASCII code 38).
    statement: The entity-body MAY include other request-specific parameters.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1.2-04
  - id: RFC6750-2.2-05
    section: "2.2"
    keyword: MUST
    text: The entity-body MAY include other request-specific parameters, in which case the "access_token" parameter MUST be properly separated from the request-specific parameters using "&" character(s) (ASCII code 38).
    statement: The access_token parameter MUST be properly separated from the request-specific parameters using & characters.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1.2-05
  - id: RFC6750-2.2-06
    section: "2.2"
    keyword: SHOULD NOT
    text: The "application/x-www-form-urlencoded" method SHOULD NOT be used except in application contexts where participating browsers do not have access to the "Authorization" request header field.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1.2-06
  - id: RFC6750-2.2-07
    section: "2.2"
    keyword: MAY
    text: Resource servers MAY support this method.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1.2-07
  - id: RFC6750-2.3-01
    section: "2.3"
    keyword: MUST
    text: The HTTP request URI query can include other request-specific parameters, in which case the "access_token" parameter MUST be properly separated from the request-specific parameters using "&" character(s) (ASCII code 38).
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1-03
    note: OAuth 2.1 removes the URI query parameter method.
  - id: RFC6750-2.3-02
    section: "2.3"
    keyword: SHOULD
    text: Clients using the URI Query Parameter method SHOULD also send a Cache-Control header containing the "no-store" option.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1-03
    note: OAuth 2.1 removes the URI query parameter method.
  - id: RFC6750-2.3-03
    section: "2.3"
    keyword: SHOULD
    text: Server success (2XX status) responses to these requests SHOULD contain a Cache-Control header with the "private" option.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1-04
    note: OAuth 2.1 removes the URI query parameter method.
  - id: RFC6750-2.3-04
    section: "2.3"
    keyword: SHOULD NOT
    text: Because of the security weaknesses associated with the URI method (see Section 5), including the high likelihood that the URL containing the access token will be logged, it SHOULD NOT be used unless it is impossible to transport the access token in the "Authorization" request header field or the HTTP request entity-body.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1-03
    note: OAuth 2.1 removes the URI query parameter method.
  - id: RFC6750-2.3-05
    section: "2.3"
    keyword: MAY
    text: Resource servers MAY support this method.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.1-04
    note: OAuth 2.1 removes the URI query parameter method.
  - id: RFC6750-3-01
    section: "3"
    keyword: MUST
    text: If the protected resource request does not include authentication credentials or does not contain an access token that enables access to the protected resource, the resource server MUST include the HTTP "WWW-Authenticate" response header field; it MAY include it in response to other conditions as well.
    statement: If the protected resource request does not include authentication credentials or does not contain an access token that enables access to the protected resource, the resource server MUST include the HTTP WWW-Authenticate response header field.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-01
  - id: RFC6750-3-02
    section: "3"
    keyword: MAY
    text: If the protected resource request does not include authentication credentials or does not contain an access token that enables access to the protected resource, the resource server MUST include the HTTP "WWW-Authenticate" response header field; it MAY include it in response to other conditions as well.
    statement: The resource server MAY include the HTTP WWW-Authenticate response header field in response to other conditions as well.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-02
  - id: RFC6750-3-03
    section: "3"
    keyword: MUST
    text: All challenges defined by this specification MUST use the auth-scheme value "Bearer".
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-03
  - id: RFC6750-3-04
    section: "3"
    keyword: MUST
    text: This scheme MUST be followed by one or more auth-param values.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-04
  - id: RFC6750-3-05
    section: "3"
    keyword: MAY
    text: Other auth-param attributes MAY be used as well.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-05
  - id: RFC6750-3-06
    section: "3"
    keyword: MAY
    text: A "realm" attribute MAY be included to indicate the scope of protection in the manner described in HTTP/1.1 [RFC2617].
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-06
  - id: RFC6750-3-07
    section: "3"
    keyword: MUST NOT
    text: The "realm" attribute MUST NOT appear more than once.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-07
  - id: RFC6750-3-08
    section: "3"
    keyword: OPTIONAL
    text: Use of the "scope" attribute is OPTIONAL.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-08
  - id: RFC6750-3-09
    section: "3"
    keyword: MUST NOT
    text: The "scope" attribute MUST NOT appear more than once.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-09
  - id: RFC6750-3-10
    section: "3"
    keyword: SHOULD
    text: If the protected resource request included an access token and failed authentication, the resource server SHOULD include the "error" attribute to provide the client with the reason why the access request was declined.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-10
  - id: RFC6750-3-11
    section: "3"
    keyword: MAY
    text: In addition, the resource server MAY include the "error_description" attribute to provide developers a human-readable explanation that is not meant to be displayed to end-users.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-11
  - id: RFC6750-3-12
    section: "3"
    keyword: MAY
    text: It also MAY include the "error_uri" attribute with an absolute URI identifying a human-readable web page explaining the error.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-12
  - id: RFC6750-3-13
    section: "3"
    keyword: MUST NOT
    text: The "error", "error_description", and "error_uri" attributes MUST NOT appear more than once.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-13
  - id: RFC6750-3-14
    section: "3"
    keyword: MUST NOT
    text: Values for the "scope" attribute (specified in Appendix A.4 of [RFC6749]) MUST NOT include characters outside the set %x21 / %x23-5B / %x5D-7E for representing scope values and %x20 for delimiters between scope values.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-14
  - id: RFC6750-3-15
    section: "3"
    keyword: MUST NOT
    text: Values for the "error" and "error_description" attributes (specified in Appendixes A.7 and A.8 of [RFC6749]) MUST NOT include characters outside the set %x20-21 / %x23-5B / %x5D-7E.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-15
  - id: RFC6750-3-16
    section: "3"
    keyword: MUST
    text: Values for the "error_uri" attribute (specified in Appendix A.9 of [RFC6749]) MUST conform to the URI-reference syntax and thus MUST NOT include characters outside the set %x21 / %x23-5B / %x5D-7E.
    statement: Values for the error_uri attribute MUST conform to the URI-reference syntax.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-16
  - id: RFC6750-3-17
    section: "3"
    keyword: MUST NOT
    text: Values for the "error_uri" attribute (specified in Appendix A.9 of [RFC6749]) MUST conform to the URI-reference syntax and thus MUST NOT include characters outside the set %x21 / %x23-5B / %x5D-7E.
    statement: Values for the error_uri attribute MUST NOT include characters outside the set %x21 / %x23-5B / %x5D-7E.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.1-17
  - id: RFC6750-3.1-01
    section: "3.1"
    keyword: SHOULD
    text: The resource server SHOULD respond with the HTTP 400 (Bad Request) status code.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.2-01
  - id: RFC6750-3.1-02
    section: "3.1"
    keyword: SHOULD
    text: The resource SHOULD respond with the HTTP 401 (Unauthorized) status code.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.2-02
  - id: RFC6750-3.1-03
    section: "3.1"
    keyword: MAY
    text: The client MAY request a new access token and retry the protected resource request.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.2-03
  - id: RFC6750-3.1-04
    section: "3.1"
    keyword: SHOULD
    text: The resource server SHOULD respond with the HTTP 403 (Forbidden) status code and MAY include the "scope" attribute with the scope necessary to access the protected resource.
    statement: For insufficient_scope, the resource server SHOULD respond with the HTTP 403 (Forbidden) status code.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.2-04
  - id: RFC6750-3.1-05
    section: "3.1"
    keyword: MAY
    text: The resource server SHOULD respond with the HTTP 403 (Forbidden) status code and MAY include the "scope" attribute with the scope necessary to access the protected resource.
    statement: For insufficient_scope, the resource server MAY include the scope attribute with the scope necessary to access the protected resource.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.2-05
  - id: RFC6750-3.1-06
    section: "3.1"
    keyword: SHOULD NOT
    text: If the request lacks any authentication information (e.g., the client was unaware that authentication is necessary or attempted using an unsupported authentication method), the resource server SHOULD NOT include an error code or other error information.
    status: superseded
    superseded_by:
      - OAUTH21D16-5.3.2-06
  - id: RFC6750-5.2-01
    section: "5.2"
    keyword: MUST
    text: Such references MUST be infeasible for an attacker to guess; using a reference may require an extra interaction between a server and the token issuer to resolve the reference to the authorization information.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.4.2-02
  - id: RFC6750-5.2-02
    section: "5.2"
    keyword: MUST
    text: The token integrity protection MUST be sufficient to prevent the token from being modified.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.4.2-03
  - id: RFC6750-5.2-03
    section: "5.2"
    keyword: RECOMMENDED
    text: Restricting the use of the token to a specific scope is also RECOMMENDED.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.2-01
  - id: RFC6750-5.2-04
    section: "5.2"
    keyword: MUST
    text: The authorization server MUST implement TLS.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-01
  - id: RFC6750-5.2-05
    section: "5.2"
    keyword: MUST
    text: To protect against token disclosure, confidentiality protection MUST be applied using TLS [RFC5246] with a ciphersuite that provides confidentiality and integrity protection.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.4.2-01
  - id: RFC6750-5.2-06
    section: "5.2"
    keyword: MUST
    text: For those cases where the client is prevented from observing the contents of the token, token encryption MUST be applied in addition to the usage of TLS protection.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.1.2-01
  - id: RFC6750-5.2-07
    section: "5.2"
    keyword: MUST
    text: As a further defense against token disclosure, the client MUST validate the TLS certificate chain when making requests to protected resources, including checking the Certificate Revocation List (CRL) [RFC5280].
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.2-01
  - id: RFC6750-5.2-08
    section: "5.2"
    keyword: MUST NOT
    text: Therefore, bearer tokens MUST NOT be stored in cookies that can be sent in the clear.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.1.2-02
  - id: RFC6750-5.2-09
    section: "5.2"
    keyword: MUST
    text: In such deployments, sufficient measures MUST be employed to ensure confidentiality of the token between the front-end and back-end servers; encryption of the token is one such possible measure.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.14-01
  - id: RFC6750-5.2-10
    section: "5.2"
    keyword: MUST
    text: 'To deal with token capture and replay, the following recommendations are made: First, the lifetime of the token MUST be limited; one means of achieving this is by putting a validity time field inside the protected part of the token.'
    statement: The lifetime of the token MUST be limited.
    status: applicable
  - id: RFC6750-5.2-11
    section: "5.2"
    keyword: MUST
    text: Second, confidentiality protection of the exchanges between the client and the authorization server and between the client and the resource server MUST be applied.
    status: superseded
    superseded_by:
      - OAUTH21D16-1.5-01
  - id: RFC6750-5.2-12
    section: "5.2"
    keyword: MUST
    text: Furthermore, when presenting the token to a resource server, the client MUST verify the identity of that resource server, as per Section 3.1 of "HTTP Over TLS" [RFC2818].
    status: out-of-scope
    reason: client-requirement
  - id: RFC6750-5.2-13
    section: "5.2"
    keyword: MUST
    text: Note that the client MUST validate the TLS certificate chain when making these requests to protected resources.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.2-01
  - id: RFC6750-5.3-01
    section: "5.3"
    keyword: MUST
    text: 'Safeguard bearer tokens: Client implementations MUST ensure that bearer tokens are not leaked to unintended parties, as they will be able to use them to gain access to protected resources.'
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.1-01
  - id: RFC6750-5.3-02
    section: "5.3"
    keyword: MUST
    text: 'Validate TLS certificate chains: The client MUST validate the TLS certificate chain when making requests to protected resources.'
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.2-01
  - id: RFC6750-5.3-03
    section: "5.3"
    keyword: MUST
    text: 'Always use TLS (https): Clients MUST always use TLS [RFC5246] (https) or equivalent transport security when making requests with bearer tokens.'
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.3-01
  - id: RFC6750-5.3-04
    section: "5.3"
    keyword: MUST NOT
    text: 'Don''t store bearer tokens in cookies: Implementations MUST NOT store bearer tokens within cookies that can be sent in the clear (which is the default transmission mode for cookies).'
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.4-01
  - id: RFC6750-5.3-05
    section: "5.3"
    keyword: MUST
    text: Implementations that do store bearer tokens in cookies MUST take precautions against cross-site request forgery.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.4-02
  - id: RFC6750-5.3-06
    section: "5.3"
    keyword: SHOULD
    text: 'Issue short-lived bearer tokens: Token servers SHOULD issue short-lived (one hour or less) bearer tokens, particularly when issuing tokens to clients that run within a web browser or other environments where information leakage may occur.'
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.5-01
  - id: RFC6750-5.3-07
    section: "5.3"
    keyword: SHOULD
    text: 'Issue scoped bearer tokens: Token servers SHOULD issue bearer tokens that contain an audience restriction, scoping their use to the intended relying party or set of relying parties.'
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.6-01
  - id: RFC6750-5.3-08
    section: "5.3"
    keyword: SHOULD NOT
    text: 'Don''t pass bearer tokens in page URLs: Bearer tokens SHOULD NOT be passed in page URLs (for example, as query string parameters).'
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.7-01
  - id: RFC6750-5.3-09
    section: "5.3"
    keyword: SHOULD
    text: Instead, bearer tokens SHOULD be passed in HTTP message headers or message bodies for which confidentiality measures are taken.
    status: superseded
    superseded_by:
      - OAUTH21D16-7.1.3.7-02
