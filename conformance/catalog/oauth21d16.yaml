    text: 'In addition to the processing rules in Section 3.2.2, the authorization server MUST: ensure that the authorization code was issued to the authenticated confidential client, or if the client is public, ensure that the code was issued to client_id in the request, verify that the authorization code is valid, verify that the code_verifier parameter is present if and only if a code_challenge parameter was present in the authorization request, if a code_verifier is present, verify the code_verifier by calculating the code challenge from the received code_verifier and comparing it with the previously associated code_challenge, after first transforming it according to the code_challenge_method method specified by the client, and If there was no code_challenge in the authorization request associated with the authorization code in the token request, the authorization server MUST reject the token request.'
    statement: The authorization server MUST verify that the authorization code is valid.
    status: applicable
