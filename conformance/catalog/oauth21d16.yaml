document: OAUTH21D16
title: The OAuth 2.1 Authorization Framework
source: ../specs/draft-ietf-oauth-v2-1-16.txt
requirements:
  - id: OAUTH21D16-1.4-01
    section: "1.4"
    keyword: MUST NOT
    text: The client MUST NOT expect to be able to parse the access token value.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-1.4-02
    section: "1.4"
    keyword: MUST
    text: Access tokens (as well as any confidential access token attributes) MUST be kept confidential in transit and storage, and only shared among the authorization server, the resource servers the access token is valid for, and the client to which the access token is issued.
    statement: Access tokens MUST be kept confidential in storage.
    status: applicable
    note: Stores receive only hashes.
  - id: OAUTH21D16-1.4-04
    section: "1.4"
    keyword: MUST
    text: Access tokens (as well as any confidential access token attributes) MUST be kept confidential in transit and storage, and only shared among the authorization server, the resource servers the access token is valid for, and the client to which the access token is issued.
    statement: Access tokens MUST be kept confidential in transit.
    status: applicable
  - id: OAUTH21D16-1.4-05
    section: "1.4"
    keyword: MUST
    text: Access tokens (as well as any confidential access token attributes) MUST be kept confidential in transit and storage, and only shared among the authorization server, the resource servers the access token is valid for, and the client to which the access token is issued.
    statement: Access tokens MUST only be shared among the authorization server, the resource servers the access token is valid for, and the client to which the access token is issued.
    status: applicable
  - id: OAUTH21D16-1.4-08
    section: "1.4"
    keyword: MUST
    text: Access tokens (as well as any confidential access token attributes) MUST be kept confidential in transit and storage, and only shared among the authorization server, the resource servers the access token is valid for, and the client to which the access token is issued.
    statement: Confidential access token attributes MUST be kept confidential in storage.
    status: host-duty
    note: The Host Application's Stores keep the Grants and scopes of tokens confidential.
  - id: OAUTH21D16-1.4-03
    section: "1.4"
    keyword: MUST
    text: The authorization server MUST ensure that access tokens cannot be generated, modified, or guessed to produce valid access tokens by unauthorized parties.
    statement: The authorization server MUST ensure that access tokens cannot be generated to produce valid access tokens by unauthorized parties.
    status: applicable
  - id: OAUTH21D16-1.4-06
    section: "1.4"
    keyword: MUST
    text: The authorization server MUST ensure that access tokens cannot be generated, modified, or guessed to produce valid access tokens by unauthorized parties.
    statement: The authorization server MUST ensure that access tokens cannot be modified to produce valid access tokens by unauthorized parties.
    status: applicable
  - id: OAUTH21D16-1.4-07
    section: "1.4"
    keyword: MUST
    text: The authorization server MUST ensure that access tokens cannot be generated, modified, or guessed to produce valid access tokens by unauthorized parties.
    statement: The authorization server MUST ensure that access tokens cannot be guessed to produce valid access tokens by unauthorized parties.
    status: applicable
  - id: OAUTH21D16-1.4.1-01
    section: 1.4.1
    keyword: MAY
    text: The authorization server MAY fully or partially ignore the scope requested by the client, based on the authorization server policy or the resource owner's instructions.
    status: applicable
  - id: OAUTH21D16-1.4.1-02
    section: 1.4.1
    keyword: MUST
    text: If the issued access token scope is different from the one requested by the client, the authorization server MUST include the scope response parameter in the token response (Section 3.2.3) to inform the client of the actual scope granted.
    status: applicable
  - id: OAUTH21D16-1.4.1-03
    section: 1.4.1
    keyword: MUST
    text: If the client omits the scope parameter when requesting authorization, the authorization server MUST either process the request using a pre-defined default value or fail the request indicating an invalid scope.
    status: applicable
    note: The server uses the Client's default scopes, or fails with invalid_scope when it has none.
  - id: OAUTH21D16-1.4.1-04
    section: 1.4.1
    keyword: SHOULD
    text: The authorization server SHOULD document its scope requirements and default value (if defined).
    statement: The authorization server SHOULD document its scope requirements.
    status: applicable
  - id: OAUTH21D16-1.4.1-05
    section: 1.4.1
    keyword: SHOULD
    text: The authorization server SHOULD document its scope requirements and default value (if defined).
    statement: The authorization server SHOULD document its default scope value (if defined).
    status: host-duty
    note: The Host Application documents the default scopes it gives each Client.
  - id: OAUTH21D16-1.4.2-01
    section: 1.4.2
    keyword: MUST
    text: To protect against access token disclosure, the communication interaction between the client and the resource server MUST utilize confidentiality and integrity protection as described in Section 1.5.
    status: applicable
  - id: OAUTH21D16-1.4.2-02
    section: 1.4.2
    keyword: MUST
    text: If a bearer token is a reference to authorization information, such references MUST be infeasible for an attacker to guess, such as using a sufficiently long cryptographically random string.
    status: applicable
    note: Access tokens are opaque values from a cryptographically secure source.
  - id: OAUTH21D16-1.4.2-03
    section: 1.4.2
    keyword: MUST
    text: If a bearer token uses an encoding mechanism to contain the authorization information in the token itself, the access token MUST use integrity protection sufficient to prevent the token from being modified.
    status: applicable
  - id: OAUTH21D16-1.4.3-01
    section: 1.4.3
    keyword: SHOULD
    text: Authorization and resource servers SHOULD use mechanisms for sender-constraining access tokens, such as OAuth Demonstration of Proof of Possession (DPoP) [RFC9449] or Mutual TLS for OAuth 2.0 [RFC8705].
    status: out-of-scope
    reason: excluded
    feature: dpop
  - id: OAUTH21D16-1.4.3-02
    section: 1.4.3
    keyword: RECOMMENDED
    text: It is RECOMMENDED to use end-to-end TLS between the client and the resource server.
    status: applicable
  - id: OAUTH21D16-1.5-01
    section: "1.5"
    keyword: MUST
    text: Implementations MUST use a mechanism to provide communication authentication, integrity and confidentiality such as Transport-Layer Security [RFC9846], to protect the exchange of clear-text credentials and tokens either in the content or in header fields from eavesdropping which enables replay (e.g., see Section 2.4.1, Section 7.5.1, Section 3.2, and Section 1.4.2).
    status: applicable
  - id: OAUTH21D16-1.5-02
    section: "1.5"
    keyword: MUST
    text: All the OAuth protocol URLs (URLs exposed by the AS, RS and Client) MUST use the https scheme except for loopback interface redirect URIs, which MAY use the http scheme.
    statement: The URLs exposed by the authorization server MUST use the https scheme.
    status: applicable
  - id: OAUTH21D16-1.5-06
    section: "1.5"
    keyword: MUST
    text: All the OAuth protocol URLs (URLs exposed by the AS, RS and Client) MUST use the https scheme except for loopback interface redirect URIs, which MAY use the http scheme.
    statement: The URLs exposed by the resource server MUST use the https scheme.
    status: applicable
  - id: OAUTH21D16-1.5-07
    section: "1.5"
    keyword: MUST
    text: All the OAuth protocol URLs (URLs exposed by the AS, RS and Client) MUST use the https scheme except for loopback interface redirect URIs, which MAY use the http scheme.
    statement: The URLs exposed by the client MUST use the https scheme, except for loopback interface redirect URIs.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-1.5-03
    section: "1.5"
    keyword: MAY
    text: All the OAuth protocol URLs (URLs exposed by the AS, RS and Client) MUST use the https scheme except for loopback interface redirect URIs, which MAY use the http scheme.
    statement: Loopback interface redirect URIs MAY use the http scheme.
    status: applicable
  - id: OAUTH21D16-1.5-04
    section: "1.5"
    keyword: MUST
    text: When using https, TLS certificates MUST be checked according to Section 4.3.4 of [RFC9110].
    status: applicable
  - id: OAUTH21D16-1.5-05
    section: "1.5"
    keyword: MAY
    text: Implementations MAY also support additional transport-layer security mechanisms that meet their security requirements.
    status: applicable
  - id: OAUTH21D16-1.7.1-01
    section: 1.7.1
    keyword: MUST NOT
    text: Implementations MUST NOT assume that a value they receive fits within a particular length.
    status: applicable
  - id: OAUTH21D16-1.7.1-02
    section: 1.7.1
    keyword: SHOULD
    text: The party that issues a value SHOULD document its length, and SHOULD take into account the limits of the components that will carry it.
    statement: The party that issues a value SHOULD document its length.
    status: applicable
  - id: OAUTH21D16-1.7.1-03
    section: 1.7.1
    keyword: SHOULD
    text: The party that issues a value SHOULD document its length, and SHOULD take into account the limits of the components that will carry it.
    statement: The party that issues a value SHOULD take into account the limits of the components that will carry it.
    status: applicable
  - id: OAUTH21D16-1.7.1-04
    section: 1.7.1
    keyword: SHOULD
    text: Implementations SHOULD support parameter values long enough that requests remain within the 8000-octet request-line length recommended by Section 3 of [RFC9112].
    status: applicable
  - id: OAUTH21D16-2-01
    section: "2"
    keyword: MUST
    text: 'Client registration MUST include: the client type as described in Section 2.1, client details needed by the grant type in use, such as redirect URIs as described in Section 2.3, and any other information required by the authorization server (e.g., application name, website, description, logo image, the acceptance of legal terms).'
    statement: Client registration MUST include the client type as described in Section 2.1.
    status: applicable
  - id: OAUTH21D16-2-02
    section: "2"
    keyword: MUST
    text: 'Client registration MUST include: the client type as described in Section 2.1, client details needed by the grant type in use, such as redirect URIs as described in Section 2.3, and any other information required by the authorization server (e.g., application name, website, description, logo image, the acceptance of legal terms).'
    statement: Client registration MUST include client details needed by the grant type in use, such as redirect URIs as described in Section 2.3.
    status: applicable
  - id: OAUTH21D16-2-03
    section: "2"
    keyword: MUST
    text: 'Client registration MUST include: the client type as described in Section 2.1, client details needed by the grant type in use, such as redirect URIs as described in Section 2.3, and any other information required by the authorization server (e.g., application name, website, description, logo image, the acceptance of legal terms).'
    statement: Client registration MUST include any other information required by the authorization server.
    status: host-duty
    note: The Host Application registers its Clients and decides what else a registration must include.
  - id: OAUTH21D16-2.1-01
    section: "2.1"
    keyword: MUST
    text: Any clients with credentials MUST take precautions to prevent leakage and abuse of their credentials.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.1-02
    section: "2.1"
    keyword: SHOULD
    text: Authorization servers SHOULD consider the level of confidence in a client's identity when deciding whether they allow a client access to more sensitive resources and operations such as the Client Credentials grant type and how often to prompt the user for consent.
    statement: Authorization servers SHOULD consider the level of confidence in a client's identity when deciding whether they allow a client the Client Credentials grant type.
    status: applicable
    note: Only confidential Clients may use client credentials.
  - id: OAUTH21D16-2.1-04
    section: "2.1"
    keyword: SHOULD
    text: Authorization servers SHOULD consider the level of confidence in a client's identity when deciding whether they allow a client access to more sensitive resources and operations such as the Client Credentials grant type and how often to prompt the user for consent.
    statement: Authorization servers SHOULD consider the level of confidence in a client's identity when deciding how often to prompt the user for consent.
    status: host-duty
    note: The Host Application decides on its consent page when to prompt the Resource Owner; the library hands it every Authorization Request.
  - id: OAUTH21D16-2.1-03
    section: "2.1"
    keyword: SHOULD NOT
    text: A single client_id SHOULD NOT be treated as more than one type of client.
    status: applicable
    note: A Client has exactly one type.
  - id: OAUTH21D16-2.2-01
    section: "2.2"
    keyword: MUST NOT
    text: The client identifier is not a secret; it is exposed to the resource owner and MUST NOT be used alone for client authentication.
    status: applicable
  - id: OAUTH21D16-2.2-02
    section: "2.2"
    keyword: SHOULD
    text: If the authorization server supports clients with client identifiers issued by parties other than the authorization server, the authorization server SHOULD take precautions to avoid clients impersonating resource owners as described in Section 7.4.
    status: out-of-scope
    reason: excluded
    feature: client-id-metadata-documents
  - id: OAUTH21D16-2.3-01
    section: "2.3"
    keyword: MUST
    text: The redirect URI MUST be an absolute URI as defined by Section 4.3 of [RFC3986].
    status: applicable
  - id: OAUTH21D16-2.3-02
    section: "2.3"
    keyword: MAY
    text: The redirect URI MAY include a query string component (Appendix C.1), which MUST be retained when adding additional query parameters.
    statement: The redirect URI MAY include a query string component.
    status: applicable
  - id: OAUTH21D16-2.3-03
    section: "2.3"
    keyword: MUST
    text: The redirect URI MAY include a query string component (Appendix C.1), which MUST be retained when adding additional query parameters.
    statement: A query string component of the redirect URI MUST be retained when adding additional query parameters.
    status: applicable
  - id: OAUTH21D16-2.3-04
    section: "2.3"
    keyword: MUST NOT
    text: The redirect URI MUST NOT include a fragment component.
    status: applicable
  - id: OAUTH21D16-2.3.1-01
    section: 2.3.1
    keyword: MUST
    text: Authorization servers MUST require clients to register their complete redirect URI (including the path component).
    status: applicable
    note: Met by exact matching against the registered redirect URIs.
  - id: OAUTH21D16-2.3.1-02
    section: 2.3.1
    keyword: MUST
    text: Authorization servers MUST reject authorization requests that specify a redirect URI that doesn't exactly match one that was registered, with an exception for loopback redirects, where an exact match is required except for the port URI component, see Section 4.1.1 for details.
    status: applicable
  - id: OAUTH21D16-2.3.1-03
    section: 2.3.1
    keyword: MAY
    text: The authorization server MAY allow the client to register multiple redirect URIs.
    status: applicable
  - id: OAUTH21D16-2.3.1-04
    section: 2.3.1
    keyword: SHOULD
    text: For private-use URI scheme-based redirect URIs, authorization servers SHOULD enforce the requirement in Section 8.4.3 that clients use schemes that are reverse domain name based.
    status: applicable
  - id: OAUTH21D16-2.3.1-05
    section: 2.3.1
    keyword: SHOULD
    text: At a minimum, any private-use URI scheme that doesn't contain a period character (.) SHOULD be rejected.
    status: applicable
  - id: OAUTH21D16-2.3.1-06
    section: 2.3.1
    keyword: MUST NOT
    text: Clients MUST NOT expose URLs that forward the user's browser to arbitrary URIs obtained from a query parameter ("open redirector"), as described in Section 7.13.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.1-07
    section: 2.3.1
    keyword: MAY
    text: The client MAY use the state request parameter to achieve per-request customization if needed rather than varying the redirect URI per request.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.2-01
    section: 2.3.2
    keyword: MUST
    text: If multiple redirect URIs have been registered to a client, the client MUST include a redirect URI with the authorization request using the redirect_uri request parameter (Section 4.1.1).
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.3-01
    section: 2.3.3
    keyword: MUST
    text: Clients MUST prevent Cross-Site Request Forgery (CSRF) attacks.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.3-02
    section: 2.3.3
    keyword: MAY
    text: Clients that have ensured that the authorization server supports the code_challenge parameter MAY rely on the CSRF protection provided by that mechanism.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.3-03
    section: 2.3.3
    keyword: MUST
    text: Otherwise, one-time use CSRF tokens carried in the state parameter that are securely bound to the user agent MUST be used for CSRF protection (see Section 7.10).
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.4-01
    section: 2.3.4
    keyword: MUST
    text: In scenarios where an OAuth client interacts with two or more authorization servers, however, clients MUST prevent mix-up attacks.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.4-02
    section: 2.3.4
    keyword: MUST
    text: In order to prevent mix-up attacks, clients MUST only process redirect responses of the issuer they sent the respective request to and from the same user agent this authorization request was initiated with.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.5-01
    section: 2.3.5
    keyword: SHOULD
    text: If an authorization request fails validation due to a missing, invalid, or mismatching redirect URI, the authorization server SHOULD inform the resource owner of the error and MUST NOT automatically redirect the user agent to the invalid redirect URI.
    statement: If an authorization request fails validation due to a missing, invalid, or mismatching redirect URI, the authorization server SHOULD inform the resource owner of the error.
    status: applicable
  - id: OAUTH21D16-2.3.5-02
    section: 2.3.5
    keyword: MUST NOT
    text: If an authorization request fails validation due to a missing, invalid, or mismatching redirect URI, the authorization server SHOULD inform the resource owner of the error and MUST NOT automatically redirect the user agent to the invalid redirect URI.
    statement: If an authorization request fails validation due to a missing, invalid, or mismatching redirect URI, the authorization server MUST NOT automatically redirect the user agent to the invalid redirect URI.
    status: applicable
  - id: OAUTH21D16-2.3.6-01
    section: 2.3.6
    keyword: SHOULD NOT
    text: The client SHOULD NOT include any third-party scripts (e.g., third-party analytics, social plug-ins, ad networks) in the redirect URI endpoint response.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.6-02
    section: 2.3.6
    keyword: SHOULD
    text: Instead, it SHOULD extract the artifacts from the URI and redirect the user agent again to another endpoint without exposing the artifacts (in the URI or elsewhere).
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.3.6-03
    section: 2.3.6
    keyword: MUST
    text: If third-party scripts are included, the client MUST ensure that its own scripts (used to extract and remove the credentials from the URI) will execute first.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-2.4-01
    section: "2.4"
    keyword: MUST
    text: The authorization server MUST only rely on client authentication if the process of issuance/registration and distribution of the underlying credentials ensures their confidentiality.
    status: host-duty
    note: The Host Application registers Clients and distributes their secrets; the library receives only secret hashes.
  - id: OAUTH21D16-2.4-02
    section: "2.4"
    keyword: MAY
    text: For confidential clients, the authorization server MAY accept any form of client authentication meeting its security requirements (e.g., client secret, public/private key pair).
    status: applicable
  - id: OAUTH21D16-2.4-03
    section: "2.4"
    keyword: RECOMMENDED
    text: It is RECOMMENDED to use asymmetric (public-key based) methods for client authentication such as mTLS [RFC8705] or using signed JWTs ("Private Key JWT") in accordance with [RFC7521], [RFC7523], and their update [I-D.ietf-oauth-rfc7523bis] (defined in [OpenID.Connect] as the client authentication method private_key_jwt).
    status: out-of-scope
    reason: excluded
    feature: private-key-jwt
  - id: OAUTH21D16-2.4-04
    section: "2.4"
    keyword: MUST
    text: When using JWT-based client authentication, clients and authorization servers MUST follow the updated guidance around aud values in [I-D.ietf-oauth-rfc7523bis].
    status: out-of-scope
    reason: excluded
    feature: private-key-jwt
  - id: OAUTH21D16-2.4-05
    section: "2.4"
    keyword: SHOULD
    text: When client authentication is not possible, the authorization server SHOULD employ other means to validate the client's identity -- for example, by requiring the registration of the client redirect URI or enlisting the resource owner to confirm identity.
    status: applicable
    note: Public Clients are bound to their registered redirect URIs.
  - id: OAUTH21D16-2.4-06
    section: "2.4"
    keyword: MUST NOT
    text: The client MUST NOT use more than one authentication method in each request to prevent a conflict of which authentication mechanism is authoritative for the request.
    status: out-of-scope
    reason: client-requirement
    note: INV-0005 states what the server does.
  - id: OAUTH21D16-2.4-07
    section: "2.4"
    keyword: MUST
    text: The authorization server MUST consider the security implications of interacting with unauthenticated clients and take measures to limit the potential exposure of tokens issued to such clients, (e.g., limiting the lifetime of refresh tokens).
    status: applicable
    note: Refresh tokens of public Clients always rotate.
  - id: OAUTH21D16-2.4-08
    section: "2.4"
    keyword: MUST
    text: The privileges an authorization server associates with a certain client identity MUST depend on the assessment of the overall process for client identification and client credential lifecycle management.
    status: host-duty
    note: The Host Application sets each Client's privileges, which are its type, grant types and allowed scopes.
  - id: OAUTH21D16-2.4.1-01
    section: 2.4.1
    keyword: MUST
    text: 'To support confidential clients in possession of a client secret, the authorization server MUST support the client including the client credentials in the request body content using the following parameters:'
    status: applicable
  - id: OAUTH21D16-2.4.1-02
    section: 2.4.1
    keyword: REQUIRED
    text: '"client_id": REQUIRED.'
    status: applicable
  - id: OAUTH21D16-2.4.1-03
    section: 2.4.1
    keyword: REQUIRED
    text: '"client_secret": REQUIRED.'
    status: applicable
  - id: OAUTH21D16-2.4.1-04
    section: 2.4.1
    keyword: MUST NOT
    text: The parameters can only be transmitted in the request content and MUST NOT be included in the request URI.
    status: applicable
    note: The server reads Client credentials only from the request content.
  - id: OAUTH21D16-2.4.1-05
    section: 2.4.1
    keyword: MAY
    text: The authorization server MAY support the HTTP Basic authentication scheme for authenticating clients that were issued a client secret.
    status: applicable
  - id: OAUTH21D16-2.4.1-06
    section: 2.4.1
    keyword: MUST
    text: Since the client secret authentication method involves a password, the authorization server MUST protect any endpoint utilizing it against brute force attacks.
    status: applicable
  - id: OAUTH21D16-2.4.2-01
    section: 2.4.2
    keyword: MAY
    text: The authorization server MAY support any suitable authentication scheme matching its security requirements.
    status: applicable
  - id: OAUTH21D16-2.4.2-02
    section: 2.4.2
    keyword: MUST
    text: When using other authentication methods, the authorization server MUST define a mapping between the client identifier (registration record) and authentication scheme.
    status: applicable
    note: The Client type of the registration record maps to none or the client secret methods.
  - id: OAUTH21D16-3-01
    section: "3"
    keyword: MAY
    text: Extension grant types MAY define additional endpoints as needed.
    status: informative
    note: Guidance for extensions.
  - id: OAUTH21D16-3.1-01
    section: "3.1"
    keyword: MUST
    text: The authorization server MUST first authenticate the resource owner.
    status: applicable
  - id: OAUTH21D16-3.1-02
    section: "3.1"
    keyword: MUST NOT
    text: The authorization endpoint URL MUST NOT include a fragment component, and MAY include a query string component (Appendix C.1), which MUST be retained when adding additional query parameters.
    statement: The authorization endpoint URL MUST NOT include a fragment component.
    status: applicable
  - id: OAUTH21D16-3.1-03
    section: "3.1"
    keyword: MAY
    text: The authorization endpoint URL MUST NOT include a fragment component, and MAY include a query string component (Appendix C.1), which MUST be retained when adding additional query parameters.
    statement: The authorization endpoint URL MAY include a query string component.
    status: applicable
  - id: OAUTH21D16-3.1-04
    section: "3.1"
    keyword: MUST
    text: The authorization endpoint URL MUST NOT include a fragment component, and MAY include a query string component (Appendix C.1), which MUST be retained when adding additional query parameters.
    statement: A query string component of the authorization endpoint URL MUST be retained when adding additional query parameters.
    status: applicable
  - id: OAUTH21D16-3.1-05
    section: "3.1"
    keyword: MUST
    text: The authorization server MUST support the use of the HTTP GET method Section 9.3.1 of [RFC9110] for the authorization endpoint and MAY support the POST method (Section 9.3.3 of [RFC9110]) as well.
    statement: The authorization server MUST support the use of the HTTP GET method for the authorization endpoint.
    status: applicable
  - id: OAUTH21D16-3.1-06
    section: "3.1"
    keyword: MAY
    text: The authorization server MUST support the use of the HTTP GET method Section 9.3.1 of [RFC9110] for the authorization endpoint and MAY support the POST method (Section 9.3.3 of [RFC9110]) as well.
    statement: The authorization server MAY support the POST method for the authorization endpoint.
    status: applicable
  - id: OAUTH21D16-3.1-07
    section: "3.1"
    keyword: MUST
    text: The authorization server MUST ignore unrecognized request parameters sent to the authorization endpoint.
    status: applicable
  - id: OAUTH21D16-3.1-08
    section: "3.1"
    keyword: MUST NOT
    text: Request and response parameters defined by this specification MUST NOT be included more than once.
    statement: Request parameters defined by this specification MUST NOT be included more than once.
    status: applicable
  - id: OAUTH21D16-3.1-12
    section: "3.1"
    keyword: MUST NOT
    text: Request and response parameters defined by this specification MUST NOT be included more than once.
    statement: Response parameters defined by this specification MUST NOT be included more than once.
    status: applicable
  - id: OAUTH21D16-3.1-09
    section: "3.1"
    keyword: MUST
    text: Parameters sent without a value MUST be treated as if they were omitted from the request.
    status: applicable
  - id: OAUTH21D16-3.1-10
    section: "3.1"
    keyword: MUST
