    status: applicable
  - id: OAUTH21D16-7.11-01
    section: "7.11"
    keyword: MUST
    text: Authorization servers MUST prevent clickjacking attacks.
    status: applicable
  - id: OAUTH21D16-7.11-02
    section: "7.11"
    keyword: SHOULD
    text: In addition to those, authorization servers SHOULD also use Content Security Policy (CSP) level 2 [CSP-2] or greater.
    status: applicable
  - id: OAUTH21D16-7.11-03
    section: "7.11"
    keyword: MAY
    text: The client MAY permit being framed by some other origin than the one used in its redirection endpoint.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.11-04
    section: "7.11"
    keyword: SHOULD
    text: For this reason, authorization servers SHOULD allow administrators to configure allowed origins for particular clients and/or for clients to register these dynamically.
    status: applicable
  - id: OAUTH21D16-7.11-05
    section: "7.11"
    keyword: SHOULD
    text: Because some user agents do not support [CSP-2], this technique SHOULD be combined with others, including those described in [RFC6819], unless such legacy user agents are explicitly unsupported by the authorization server.
    status: applicable
  - id: OAUTH21D16-7.11-06
    section: "7.11"
    keyword: SHOULD
    text: Even in such cases, additional countermeasures SHOULD still be employed.
    status: applicable
  - id: OAUTH21D16-7.12-01
    section: "7.12"
    keyword: MUST
    text: The authorization server and client MUST treat parameters received as potentially malicious external input and apply appropriate protections, in particular, the values of the state and redirect_uri parameters.
    statement: The authorization server MUST treat parameters received as potentially malicious external input and apply appropriate protections, in particular, the values of the state and redirect_uri parameters.
    status: applicable
  - id: OAUTH21D16-7.12-02
    section: "7.12"
    keyword: MUST
    text: The authorization server and client MUST treat parameters received as potentially malicious external input and apply appropriate protections, in particular, the values of the state and redirect_uri parameters.
    statement: The client MUST treat parameters received as potentially malicious external input and apply appropriate protections.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.13.1-01
    section: 7.13.1
    keyword: MUST NOT
    text: Clients MUST NOT expose open redirectors.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.13.2-01
    section: 7.13.2
    keyword: MUST NOT
    text: Section 4.1.2.1 already prevents open redirects by stating that the authorization server MUST NOT automatically redirect the user agent in case of an invalid combination of client_id and redirect_uri.
    status: informative
    note: Restates Section 4.1.2.1.
  - id: OAUTH21D16-7.13.2-02
    section: 7.13.2
    keyword: MUST
    text: The authorization server MUST take precautions to prevent these threats.
    status: applicable
  - id: OAUTH21D16-7.13.2-03
    section: 7.13.2
    keyword: MUST
    text: The authorization server MUST always authenticate the user first and, with the exception of the silent authentication use case, prompt the user for credentials when needed, before redirecting the user.
    status: applicable
  - id: OAUTH21D16-7.13.2-04
    section: 7.13.2
    keyword: SHOULD
    text: The authorization server SHOULD only automatically redirect the user agent if it trusts the redirect URI.
    status: applicable
    note: Only registered redirect URIs are redirected to.
  - id: OAUTH21D16-7.13.2-05
    section: 7.13.2
    keyword: MAY
    text: If the URI is not trusted, the authorization server MAY inform the user and rely on the user to make the correct decision.
    status: applicable
  - id: OAUTH21D16-7.14-01
    section: "7.14"
    keyword: MUST
    text: In such deployments, sufficient measures MUST be employed to ensure confidentiality of the access token between the front-end and back-end servers; encryption of the token is one such possible measure.
    status: applicable
  - id: OAUTH21D16-7.15-01
    section: "7.15"
    keyword: MUST
    text: In scenarios where an OAuth client interacts with two or more authorization servers, however, clients MUST prevent mix-up attacks.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.15-02
    section: "7.15"
    keyword: MUST
    text: For both defenses, clients MUST store, for each authorization request, the issuer they sent the authorization request to, bind this information to the user agent, and check that the authorization response was received from the correct issuer.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.15-03
    section: "7.15"
    keyword: MUST
    text: Clients MUST ensure that the subsequent access token request, if applicable, is sent to the same issuer.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.15.1-01
    section: 7.15.1
    keyword: MUST
    text: When receiving the authorization response, the client MUST compare the received issuer identifier to the stored issuer identifier.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.15.1-02
    section: 7.15.1
    keyword: MUST
    text: If there is a mismatch, the client MUST abort the interaction.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.15.1-03
    section: 7.15.1
    keyword: MUST
    text: In both cases, the iss value MUST be evaluated according to [RFC9207].
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.15.2-01
    section: 7.15.2
    keyword: MUST
    text: For this defense, clients MUST use a distinct redirect URI for each issuer they interact with.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.15.2-02
    section: 7.15.2
    keyword: MUST
    text: Clients MUST check that the authorization response was received from the correct issuer by comparing the distinct redirect URI for the issuer to the URI where the authorization response was received on.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.15.2-03
    section: 7.15.2
    keyword: MUST
    text: If there is a mismatch, the client MUST abort the flow.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-7.15.2-04
    section: 7.15.2
    keyword: SHOULD
    text: This defense SHOULD therefore only be used if other options are not available.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.1-01
    section: "8.1"
    keyword: MUST NOT
    text: For this reason, authorization servers MUST NOT require client authentication of native app clients using a shared secret, as this serves no value beyond client identification which is already provided by the client_id request parameter.
    status: applicable
  - id: OAUTH21D16-8.1-02
    section: "8.1"
    keyword: MUST
    text: Authorization servers that still require a statically included shared secret for native app clients MUST treat the client as a public client (as defined in Section 2.1), and not accept the secret as proof of the client's identity.
    status: applicable
  - id: OAUTH21D16-8.1.1-01
    section: 8.1.1
    keyword: MUST
    text: Except when using a mechanism like Dynamic Client Registration [RFC7591] to provision per-instance credentials, native apps are classified as public clients, as defined in Section 2.1, and MUST be registered with the authorization server as such.
    status: host-duty
    note: The Host Application registers native apps as public Clients.
  - id: OAUTH21D16-8.1.1-02
    section: 8.1.1
    keyword: MUST
    text: Authorization servers MUST record the client type in the client registration details in order to identify and process requests accordingly.
    status: applicable
    note: A Client has a type in the Client Store.
  - id: OAUTH21D16-8.2-01
    section: "8.2"
    keyword: MUST
    text: Native apps MUST use an external user agent to perform OAuth authorization requests.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.3-01
    section: "8.3"
    keyword: MAY
    text: Typically, the external user agent used is the default browser, that is, the application configured for handling http and https scheme URIs on the system; however, different browser selection criteria and other categories of external user agents MAY be used.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.3-02
    section: "8.3"
    keyword: RECOMMENDED
    text: This best practice focuses on the browser as the RECOMMENDED external user agent for native apps.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.3-03
    section: "8.3"
    keyword: MAY
    text: An external user agent designed specifically for user authorization and capable of processing authorization requests and responses like a browser MAY also be used.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.3-04
    section: "8.3"
    keyword: RECOMMENDED
    text: On platforms where they are supported, it is RECOMMENDED, for usability reasons, that apps use in-app browser tabs for the authorization request.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.4.1-01
    section: 8.4.1
    keyword: REQUIRED
    text: As the redirect URI alone is not enough to distinguish public native app clients from confidential web clients, it is REQUIRED in Section 8.1.1 that the client type be recorded during client registration to enable the server to determine the client type and act accordingly.
    status: informative
    note: Restates Section 8.1.1.
  - id: OAUTH21D16-8.4.1-02
    section: 8.4.1
    keyword: SHOULD
    text: For this reason, native apps SHOULD use them over the other options where possible.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.4.2-01
    section: 8.4.2
    keyword: NOT RECOMMENDED
    text: While redirect URIs using the name localhost (i.e., http://localhost:{port}/{path}) function similarly to loopback IP redirects, the use of localhost is NOT RECOMMENDED.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.4.2-02
    section: 8.4.2
    keyword: MUST
    text: The authorization server MUST allow any port to be specified at the time of the request for loopback IP redirect URIs, to accommodate clients that obtain an available ephemeral port from the operating system at the time of the request.
    status: applicable
  - id: OAUTH21D16-8.4.2-03
    section: 8.4.2
    keyword: SHOULD NOT
    text: Clients SHOULD NOT assume that the device supports a particular version of the Internet Protocol.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.4.2-04
    section: 8.4.2
    keyword: RECOMMENDED
    text: It is RECOMMENDED that clients attempt to bind to the loopback interface using both IPv4 and IPv6 and use whichever is available.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.4.3-01
    section: 8.4.3
    keyword: MUST
    text: When choosing a URI scheme to associate with the app, apps MUST use a URI scheme based on a domain name under their control, expressed in reverse order, as recommended by Section 3.8 of [RFC7595] for private-use URI schemes.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.5.4-01
    section: 8.5.4
    keyword: MAY
    text: Loopback interface redirect URIs MAY use the http scheme (i.e., without TLS).
    status: applicable
  - id: OAUTH21D16-8.5.4-02
    section: 8.5.4
    keyword: SHOULD
    text: Clients SHOULD open the network port only when starting the authorization request and close it once the response is returned.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.5.4-03
    section: 8.5.4
    keyword: SHOULD
    text: Clients SHOULD listen on the loopback network interface only, in order to avoid interference by other network actors.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-8.5.4-04
    section: 8.5.4
    keyword: SHOULD
    text: Clients SHOULD use loopback IP literals rather than the string localhost as described in Section 8.4.2.
    status: out-of-scope
    reason: client-requirement
  - id: OAUTH21D16-10.2-01
    section: "10.2"
    keyword: MUST
    text: For backwards compatibility of an authorization server wishing to support both OAuth 2.0 and OAuth 2.1 clients, the authorization server MUST allow clients to send the redirect_uri parameter in the token request (Section 4.1.3), and MUST enforce the parameter as described in [RFC6749].
    statement: The authorization server MUST allow clients to send the redirect_uri parameter in the token request.
    status: applicable
  - id: OAUTH21D16-10.2-02
    section: "10.2"
    keyword: MUST
    text: For backwards compatibility of an authorization server wishing to support both OAuth 2.0 and OAuth 2.1 clients, the authorization server MUST allow clients to send the redirect_uri parameter in the token request (Section 4.1.3), and MUST enforce the parameter as described in [RFC6749].
    statement: The authorization server MUST enforce the redirect_uri parameter in the token request as described in RFC 6749.
    status: applicable
  - id: OAUTH21D16-B-01
    section: B
    keyword: MUST
    text: To address this shortcoming when generating contents using this media type, names and values MUST be encoded using the UTF-8 character encoding scheme [RFC3629] first; the resulting octet sequence then needs to be further encoded using the escaping rules defined in [W3C.REC-html401-19991224].
    status: applicable
  - id: OAUTH21D16-C.3-01
    section: C.3
    keyword: SHOULD
    text: Omitted parameters and parameters with no value SHOULD be omitted from the object and not represented by a JSON null value, unless otherwise specified.
    status: applicable
  - id: OAUTH21D16-C.3-02
    section: C.3
    keyword: MAY
    text: A parameter MAY have a JSON object or a JSON array as its value.
    status: informative
    note: Guidance for extensions.
