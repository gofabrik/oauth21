  - id: OAUTH21D16-4.3.1-06
    section: 4.3.1
    keyword: MUST
    text: 'Authorization servers MUST utilize one of these methods to detect refresh token replay by malicious actors for public clients: _Sender-constrained refresh tokens:_ the authorization server cryptographically binds the refresh token to a certain client instance, e.g., by utilizing DPoP [RFC9449] or mTLS [RFC8705]. _Refresh token rotation:_ the authorization server issues a new refresh token with every access token refresh response. The previous refresh token is invalidated but information about the relationship is retained by the authorization server. If a refresh token is compromised and subsequently used by both the attacker and the legitimate client, one of them will present an invalidated refresh token, which will inform the authorization server of the breach. The authorization server cannot determine which party submitted the invalid refresh token, but it will revoke the active refresh token as well as the access authorization grant associated with it. This stops the attack at the cost of forcing the legitimate client to obtain a fresh authorization grant.'
    status: applicable
    note: Refresh tokens of public Clients always rotate.
  - id: OAUTH21D16-4.3.1-07
