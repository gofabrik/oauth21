version: '3'

vars:
  MODULES: . conformance tools examples
  GOLANGCI_LINT: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
  GREMLINS: github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
  FUZZTIME: 10s

tasks:
  check:
    desc: Run everything CI runs on a pull request
    cmds:
      - task: build
      - task: test
      - task: fuzz
      - task: lint
      - task: vuln
      - task: archlint
      - task: specs:verify
      - task: catalog

  build:
    desc: Build and vet all modules
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go build ./... && go vet ./...

  test:
    desc: Run tests with the race detector in all modules
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go test -race ./...

  fuzz:
    desc: Run every fuzz target briefly in all modules
    cmds:
      - |
        set -o pipefail
        root=$PWD
        out=$(mktemp)
        trap 'rm -f "$out"' EXIT
        status=0
        for module in {{.MODULES}}; do
          cd "$root/$module"
          pkgs=$(go list ./...) || status=1
          for pkg in $pkgs; do
            targets=$(go test -list '^Fuzz' "$pkg") || { echo "$targets"; status=1; continue; }
            for target in $(echo "$targets" | grep '^Fuzz'); do
              go test "$pkg" -run '^$' -fuzz "^$target\$" -fuzztime {{.FUZZTIME}} -fuzzminimizetime 1000x 2>&1 | tee "$out" && continue
              # Pass a run that failed only with the deadline line and logged no failing input.
              if grep -qx '[[:space:]]*context deadline exceeded' "$out" && ! grep -qi 'failing input' "$out"; then
                echo "$target: ignoring the fuzz coordinator's deadline race"
                continue
              fi
              status=1
            done
          done
        done
        exit $status

  mutation:
    desc: Mutate the core module against its own and the conformance tests, writing the results to mutation.json
    env:
      GOFLAGS: -count=1
    cmds:
      - |
        out=$PWD/mutation.json
        copy=$(mktemp -d)
        trap 'rm -rf "$copy"' EXIT
        cp -R . "$copy"
        cd "$copy"
        rm conformance/go.mod conformance/go.sum
        go mod tidy
        go run {{.GREMLINS}} unleash --integration --coverpkg 'github.com/gofabrik/oauth21/...' \
          --exclude-files '^(tools|examples|conformance|storetest)/' --output "$out" .

  lint:
    desc: Run golangci-lint in all modules
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go run {{.GOLANGCI_LINT}} run ./...

  vuln:
    desc: Run govulncheck in all modules
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go run {{.GOVULNCHECK}} ./...

  example:run:
    desc: Run the example Authorization Server, Client and Resource Server
    cmds:
      - cd tools && go run ./example ../examples

  oauch:
    desc: Run OAuch against the example Authorization Server in Docker, writing interop/oauch/results
    dir: interop/oauch
    env:
      DRIVER_USER:
        sh: echo "$(id -u):$(id -g)"
    cmds:
      - mkdir -p results
      - defer: docker compose down
      - docker compose up --build --attach driver --exit-code-from driver

  archlint:
    desc: Check the architecture rules of the core module
    cmds:
      - cd tools && go run ./archlint ..

  catalog:
    desc: Validate the requirement catalog and gate its coverage against BASE (default HEAD)
    env:
      BASE: '{{.BASE | default "HEAD"}}'
    cmds:
      - cd tools && go run ./catalog validate ../conformance/catalog
      - |
        set -o pipefail
        base=$(mktemp -d)
        trap 'rm -rf "$base"' EXIT
        git archive "$BASE" conformance/catalog | tar -x -C "$base"
        cd tools && go run ./catalog coverage .. "$base"

  specs:fetch:
    desc: Download the spec texts listed in conformance/specs/SOURCES
    dir: conformance/specs
    cmds:
      - while read -r file url; do curl -fsSL "$url" -o "$file"; done < SOURCES

  specs:verify:
    desc: Verify the spec texts against their pinned checksums
    dir: conformance/specs
    cmds:
      - shasum -a 256 -c SHA256SUMS
